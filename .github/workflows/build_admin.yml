name: Build NexCard Admin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Build Admin APK
        run: |
          flutter create --org com.nexcard.iq --project-name nexcard_admin /tmp/admin
          cp lib/main_admin.dart /tmp/admin/lib/main.dart
          cp pubspec_admin.yaml /tmp/admin/pubspec.yaml
          mkdir -p /tmp/admin/assets
          cp assets/admin.html /tmp/admin/assets/
          cd /tmp/admin
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/nexcard-admin.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexcard-admin
          path: nexcard-admin.apk