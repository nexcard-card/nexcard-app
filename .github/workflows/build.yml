الاسم: تطبيق بناء NexCard
على:
  يدفع:
    الفروع: [الرئيسي]
  workflow_dispatch:
الوظائف:
  يبني:
    يعمل على: أوبونتو-أحدث
    خطوات:
      - يستخدم: actions/checkout@v4
      - يستخدم: actions/setup-java@v4
        مع:
          التوزيع: الزولو
          إصدار جافا: '17'
      - يستخدم: subosito/flutter-action@v2
        مع:
          إصدار فلاتر: 3.19.6
          القناة: مستقرة
      - الاسم: إنشاء ملف APK
        تشغيل: flutter create --org com.nexcard.iq --project-name nexcard /tmp/build && cp lib/main.dart /tmp/build/lib/main.dart && cp pubspec.yaml /tmp/build/pubspec.yaml && mkdir -p /tmp/build/assets && cp assets/index.html /tmp/build/assets/index.html && cd /tmp/build && flutter pub get && flutter build apk --release --no-tree-shake-icons && cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/NexCard.apk
      - يستخدم: actions/upload-artifact@v4
        مع:
          الاسم: NexCard-APK
          المسار: NexCard.apk
          أيام الاحتفاظ: 30
