name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
      - name: build
        run: |
          flutter create --org com.nexcard.iq --project-name nexcard /tmp/n
          cp lib/main.dart /tmp/n/lib/main.dart
          cp pubspec.yaml /tmp/n/pubspec.yaml
          mkdir -p /tmp/n/assets
          cp -r assets/. /tmp/n/assets/
          cd /tmp/n
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.apk