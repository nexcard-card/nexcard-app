الاسم: CI
على:
  يدفع:
    الفروع: [الرئيسي]
  workflow_dispatch:
الوظائف:
  يبني:
    يعمل على: أوبونتو-أحدث
    خطوات:
      - يستخدم: actions/checkout@v4
      - يستخدم: actions/setup-java@v4
        مع:
          التوزيع: الزولو
          إصدار جافا: 17
      - يستخدم: subosito/flutter-action@v2
        مع:
          إصدار فلاتر: 3.19.6
          القناة: مستقرة
      - الاسم: بناء
        تشغيل: |
          flutter create --org com.nexcard.iq --project-name nexcard /tmp/n
          انسخ الملف lib/main.dart إلى /tmp/n/lib/main.dart
          انسخ ملف pubspec.yaml إلى المسار /tmp/n/pubspec.yaml
          mkdir -p /tmp/n/assets
          cp assets/index.html /tmp/n/assets/index.html
          cd /tmp/n
          فلاتر باب جيت
          flutter build apk --release
          انسخ الملف build/app/outputs/flutter-apk/app-release.apk إلى $GITHUB_WORKSPACE/app.apk
      - يستخدم: actions/upload-artifact@v4
        مع:
          الاسم: تطبيق
          المسار: app.apk
