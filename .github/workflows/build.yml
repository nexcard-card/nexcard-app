name: Build NexCard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build APK
        run: |
          # Create fresh project
          flutter create --org com.nexcard.iq --project-name nexcard /tmp/build
          
          # Copy our custom files
          cp lib/main.dart /tmp/build/lib/main.dart
          cp pubspec.yaml /tmp/build/pubspec.yaml
          mkdir -p /tmp/build/assets
          cp assets/index.html /tmp/build/assets/index.html
          
          # Fix Android Gradle
          cd /tmp/build
          
          # Update gradle wrapper
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\\/\\/services.gradle.org\\/distributions\\/gradle-8.0-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # Update build.gradle
          sed -i 's/compileSdkVersion .*/compileSdk 34/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdk 21/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdk 34/' android/app/build.gradle
          
          # Build
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # Copy result
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/NexCard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NexCard-APK
          path: NexCard.apk
          retention-days: 30
