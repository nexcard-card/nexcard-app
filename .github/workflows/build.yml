name: Build NexCard APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Build APK
        run: |
          flutter create --org com.nexcard.iq --project-name nexcard /tmp/build
          cp lib/main.dart /tmp/build/lib/main.dart
          cp pubspec.yaml /tmp/build/pubspec.yaml
          mkdir -p /tmp/build/assets
          cp assets/index.html /tmp/build/assets/index.html
          cd /tmp/build
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/
      - uses: actions/upload-artifact@v4
        with:
          name: NexCard-APK
          path: app-release.apk
          retention-days: 30
